<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ex_viewer</title>
    <link rel="stylesheet" href="exhentai.css">
    <link rel="stylesheet" href="home.css">
    <script src="../home.js"></script>
</head>
<body class="home-page">
    <div class="home-shell" id="homeShell">
        <aside class="home-sidebar" id="sideMenu" aria-label="Library">
            <div class="home-brand">
                <button type="button" id="menuButton" class="home-icon-button" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button>
                <strong class="home-brand-name">ex_viewer</strong>
            </div>

            <nav class="home-navigation" aria-label="Library">
                <div class="home-nav-heading" id="libraryHeading">Library</div>
                <button type="button" id="allBooks" class="home-nav-item" aria-label="All books" title="All books">
                    <span class="home-nav-icon" aria-hidden="true">▦</span>
                    <span class="home-nav-label" id="allBooksLabel">All books</span>
                </button>
                <button type="button" id="notMatched" class="home-nav-item" aria-label="Unmatched" title="Unmatched">
                    <span class="home-nav-icon" aria-hidden="true">◇</span>
                    <span class="home-nav-label" id="notMatchedLabel">Unmatched</span>
                </button>
            </nav>

            <section class="home-history" aria-labelledby="historyHeading">
                <h2 class="home-nav-heading" id="historyHeading">Search history</h2>
                <ul id="historyList"></ul>
                <button type="button" id="sideClearButton" class="home-history-clear">Clear list</button>
            </section>

            <div class="home-sidebar-bottom">
                <button type="button" id="settingButton" class="home-nav-item" aria-label="Settings" title="Settings">
                    <span class="home-nav-icon" aria-hidden="true">⚙</span>
                    <span class="home-nav-label" id="settingsLabel">Settings</span>
                </button>
            </div>
        </aside>

        <main class="home-main">
            <div class="home-content">
                <div class="home-view-heading">
                    <h1 id="viewTitle">All books</h1>
                </div>

                <section class="home-search-panel" aria-label="Search and categories">
                    <form id="from_onsubmit">
                        <div class="home-search-row">
                            <input type="text" id="f_search" name="f_search" maxlength="200" autocomplete="off" placeholder="Search" aria-label="Search">
                            <input type="submit" id="searchSubmit" value="Search">
                            <input type="button" id="searchClear" value="Clear">
                        </div>
                        <div class="home-category-row" aria-label="Categories">
                            <span class="home-filter-label" id="categoryLabel">Categories</span>
                            <button type="button" id="cat_2" class="home-category ct2">Doujinshi</button>
                            <button type="button" id="cat_4" class="home-category ct3">Manga</button>
                            <button type="button" id="cat_8" class="home-category ct4">Artist CG</button>
                            <button type="button" id="cat_16" class="home-category ct5">Game CG</button>
                            <button type="button" id="cat_512" class="home-category cta">Western</button>
                            <button type="button" id="cat_256" class="home-category ct9">Non-H</button>
                            <button type="button" id="cat_32" class="home-category ct6">Image Set</button>
                            <button type="button" id="cat_64" class="home-category ct7">Cosplay</button>
                            <button type="button" id="cat_128" class="home-category ct8">Asian Porn</button>
                            <button type="button" id="cat_1" class="home-category ct1">Misc</button>
                        </div>
                    </form>
                </section>

                <div class="home-results-bar">
                    <span id="pageSelectorText"></span>
                    <label class="home-sort">
                        <span id="sortLabel">Sort</span>
                        <select id="sortSelect">
                            <option value="name">Name</option>
                            <option value="random">Random</option>
                            <option value="chronology">Chronology</option>
                        </select>
                    </label>
                </div>
                <nav id="pagerTop" class="home-pager home-pager-top" aria-label="Pages"></nav>
                <div id="page"></div>
                <nav id="pager" class="home-pager" aria-label="Pages"></nav>
            </div>
        </main>
    </div>
</body>
</html>
